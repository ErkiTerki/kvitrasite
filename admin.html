<!DOCTYPE html>
<html>
<head>
  <title>Admin — Digital Receipts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #111; color: #eee; padding: 2rem; }

    /* Login */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1a1a1a; border-radius: 8px; padding: 2rem; width: 100%; max-width: 380px; }
    .card h1 { margin-bottom: 1.5rem; font-size: 1.3rem; }
    input { width: 100%; padding: .75rem; margin-bottom: 1rem; background: #222; border: 1px solid #333; border-radius: 4px; color: #eee; font-size: 1rem; }
    input:focus { outline: none; border-color: #1565c0; }
    .btn { padding: .5rem 1rem; background: #1565c0; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: .9rem; }
    .btn:hover { background: #1976d2; }
    .btn-full { width: 100%; padding: .75rem; font-size: 1rem; }
    .btn-secondary { background: #2a2a2a; }
    .btn-secondary:hover { background: #333; }
    .error { color: #f44336; font-size: .875rem; margin-bottom: 1rem; }

    /* Dashboard */
    #dashboard { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .top-bar h1 { font-size: 1.3rem; }

    /* Customer table */
    table { width: 100%; border-collapse: collapse; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
    th { text-align: left; padding: .75rem 1rem; border-bottom: 1px solid #2a2a2a; color: #888; font-size: .8rem; text-transform: uppercase; }
    td { padding: .75rem 1rem; border-bottom: 1px solid #1f1f1f; font-size: .9rem; }
    tr:last-child td { border-bottom: none; }
    tr.clickable:hover td { background: #222; cursor: pointer; }

    /* Receipts panel */
    #receipts-view { display: none; }
    .back-btn { margin-bottom: 1.5rem; }
    .panel { background: #1a1a1a; border-radius: 8px; padding: 1.5rem; }
    .panel-title { font-size: 1rem; margin-bottom: 1.2rem; color: #888; }
    .receipt-card { background: #222; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .receipt-card h3 { font-size: .95rem; margin-bottom: .3rem; }
    .receipt-card .date { font-size: .8rem; color: #666; margin-bottom: .75rem; }
    .item-row { display: flex; justify-content: space-between; font-size: .85rem; padding: .2rem 0; color: #bbb; }
    .divider { border: none; border-top: 1px solid #333; margin: .6rem 0; }
    .total-row { display: flex; justify-content: space-between; font-weight: bold; font-size: .9rem; }
    .empty { color: #555; padding: 1.5rem 0; }
    .badge { background: #1565c0; color: #fff; font-size: .7rem; padding: .2rem .5rem; border-radius: 3px; }
  </style>
</head>
<body>

  <div class="login-wrap" id="login-wrap">
    <div class="card">
      <h1>Admin Login</h1>
      <div id="error" class="error" style="display:none"></div>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
      <button class="btn btn-full" onclick="login()">Log in</button>
    </div>
  </div>

  <div id="dashboard">
    <div class="top-bar">
      <h1>Admin Dashboard</h1>
      <button class="btn btn-secondary" onclick="logout()">Log out</button>
    </div>

    <div id="customers-view">
      <table>
        <thead>
          <tr><th>Email</th><th>Name</th><th>Joined</th><th></th></tr>
        </thead>
        <tbody id="customer-rows"></tbody>
      </table>
    </div>

    <div id="receipts-view">
      <button class="btn btn-secondary back-btn" onclick="showCustomers()">← Back to customers</button>
      <div class="panel">
        <div class="panel-title" id="receipts-title"></div>
        <div id="receipts-list"></div>
      </div>
    </div>
  </div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://whvrazrcoytddafpdujg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndodnJhenJjb3l0ZGRhZnBkdWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MDU3MjksImV4cCI6MjA5Mzk4MTcyOX0.-nQMSGqr3m2B6q9vfZTSMbip_W7Q6vRvlrQqS7xhZF0'
    );

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error');

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { errEl.textContent = error.message; errEl.style.display = ''; return; }

      const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', data.user.id).single();
      if (!profile?.is_admin) {
        await sb.auth.signOut();
        errEl.textContent = 'Not authorized as admin.';
        errEl.style.display = '';
        return;
      }

      showDashboard();
    }

    async function logout() {
      await sb.auth.signOut();
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-wrap').style.display = 'flex';
    }

    async function showDashboard() {
      document.getElementById('login-wrap').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadCustomers();
    }

    async function loadCustomers() {
      const { data: customers, error } = await sb.rpc('get_all_profiles');
      const tbody = document.getElementById('customer-rows');
      tbody.innerHTML = '';

      if (!customers || customers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No customers yet.</td></tr>';
        return;
      }

      customers.forEach(c => {
        const tr = document.createElement('tr');
        tr.className = 'clickable';
        tr.innerHTML = `
          <td>${c.email || '—'}</td>
          <td>${c.full_name || '—'}</td>
          <td>${new Date(c.created_at).toLocaleDateString()}</td>
          <td>${c.is_admin ? '<span class="badge">admin</span>' : ''}</td>
        `;
        tr.onclick = () => showReceipts(c);
        tbody.appendChild(tr);
      });
    }

    async function showReceipts(customer) {
      document.getElementById('customers-view').style.display = 'none';
      document.getElementById('receipts-view').style.display = 'block';
      document.getElementById('receipts-title').textContent = customer.email;

      const { data: receipts } = await sb.rpc('get_receipts_for_customer', { p_customer_id: customer.id });
      const list = document.getElementById('receipts-list');

      if (!receipts || receipts.length === 0) {
        list.innerHTML = '<p class="empty">No receipts for this customer yet.</p>';
        return;
      }

      list.innerHTML = receipts.map(r => `
        <div class="receipt-card">
          <h3>${r.store_name || 'Purchase'}</h3>
          <div class="date">${new Date(r.created_at).toLocaleString()}</div>
          ${r.items && r.items.length ? `
            ${r.items.map(i => `
              <div class="item-row"><span>${i.name} x${i.qty}</span><span>${i.value}</span></div>
            `).join('')}
            <hr class="divider">
            <div class="total-row"><span>Total</span><span>${r.total_amount}</span></div>
          ` : '<span style="color:#555;font-size:.85rem">No item data</span>'}
        </div>
      `).join('');
    }

    function showCustomers() {
      document.getElementById('receipts-view').style.display = 'none';
      document.getElementById('customers-view').style.display = 'block';
    }

    sb.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) return;
      const { data: profile } = await sb.from('profiles').select('is_admin').eq('id', session.user.id).single();
      if (profile?.is_admin) showDashboard();
    });
  </script>
</body>
</html>
