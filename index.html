<!DOCTYPE html>
<html>
<head>
  <title>Kvitra — Digital Receipts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #FFF5F3;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .hero h1 {
      font-family: 'Roboto', sans-serif;
      font-style: italic;
      font-weight: 600;
      font-size: 2.8rem;
      color: #c0574a;
      line-height: 1.2;
      margin-bottom: .5rem;
      letter-spacing: .02em;
    }

    .hero p {
      font-size: .95rem;
      color: #b08880;
      font-weight: 300;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 32px rgba(192, 87, 74, 0.08);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 500;
      color: #888;
      margin-bottom: 1.4rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    input {
      width: 100%;
      padding: .8rem 1rem;
      margin-bottom: .9rem;
      background: #FFF5F3;
      border: 1.5px solid #FDDDD7;
      border-radius: 8px;
      color: #2c2c2c;
      font-size: .95rem;
      font-family: 'Inter', sans-serif;
      transition: border-color .2s;
    }

    input:focus {
      outline: none;
      border-color: #E8806A;
    }

    input::placeholder { color: #c4a09a; }

    button {
      width: 100%;
      padding: .85rem;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: .6rem;
      transition: all .2s;
    }

    .btn-primary {
      background: #E8806A;
      color: #fff;
    }

    .btn-primary:hover { background: #d96e58; }

    .btn-secondary {
      background: transparent;
      color: #E8806A;
      border: 1.5px solid #FDDDD7;
    }

    .btn-secondary:hover { background: #FFF5F3; }

    .error  { color: #c0392b; font-size: .85rem; margin-bottom: .9rem; text-align: center; }
    .success { color: #7a9e7e; font-size: .85rem; margin-bottom: .9rem; text-align: center; }

    /* Dashboard */
    #dashboard { display: none; width: 100%; max-width: 560px; }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    .dash-header h2 {
      font-family: 'Roboto', sans-serif;
      font-style: italic;
      font-weight: 600;
      font-size: 2rem;
      color: #c0574a;
    }

    .dash-header button {
      width: auto;
      padding: .4rem .9rem;
      font-size: .85rem;
      margin: 0;
    }

    /* Week navigation */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-radius: 12px;
      padding: .45rem .75rem;
      margin-bottom: .75rem;
      box-shadow: 0 2px 16px rgba(192, 87, 74, 0.06);
    }

    .week-nav-btn {
      background: none;
      border: none;
      width: auto;
      margin: 0;
      padding: .2rem .6rem;
      font-size: 1.5rem;
      color: #c0574a;
      cursor: pointer;
      border-radius: 6px;
      line-height: 1;
      transition: background .15s;
    }

    .week-nav-btn:hover { background: #FFF0ED; }
    .week-nav-label { font-size: .88rem; font-weight: 500; color: #2c2c2c; }

    /* Day groups */
    .day-group {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(192, 87, 74, 0.06);
      margin-bottom: .5rem;
      overflow: hidden;
    }

    .day-group.empty-day { opacity: .32; }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .85rem 1.4rem;
      gap: .75rem;
    }

    .day-group:not(.empty-day) .day-header { cursor: pointer; user-select: none; }
    .day-group:not(.empty-day) .day-header:hover { background: #FFF8F7; }
    .day-group.open .day-header { border-bottom: 1px solid #FFF0ED; }
    .day-group.open .day-header .chevron { transform: rotate(180deg); }

    .day-date { font-size: .9rem; font-weight: 500; }
    .day-count { font-size: .75rem; color: #b08880; margin-top: .12rem; }

    .day-header-right { display: flex; align-items: center; flex-shrink: 0; }

    .day-body { display: none; }
    .day-group.open .day-body { display: block; }

    /* Receipt cards inside day-body */
    .receipt-card { border-bottom: 1px solid #FFF5F3; }
    .receipt-card:last-child { border-bottom: none; }

    .receipt-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .85rem 1.4rem;
      cursor: pointer;
      user-select: none;
      gap: 1rem;
    }

    .receipt-summary:hover { background: #FFF8F7; }
    .receipt-summary-left h3 { font-size: .88rem; font-weight: 500; }
    .receipt-summary-left .time { font-size: .73rem; color: #b08880; margin-top: .1rem; }

    .receipt-summary-right { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }
    .receipt-total { font-size: .88rem; font-weight: 500; color: #c0574a; }

    .chevron {
      width: 15px;
      height: 15px;
      color: #d9b0aa;
      transition: transform .22s ease;
      flex-shrink: 0;
    }

    .receipt-card.open .chevron { transform: rotate(180deg); }

    .receipt-body {
      display: none;
      padding: 0 1.4rem 1rem;
      border-top: 1px solid #FFF0ED;
    }

    .receipt-card.open .receipt-body { display: block; }

    .item-row {
      display: flex;
      justify-content: space-between;
      font-size: .855rem;
      padding: .27rem 0;
      color: #666;
    }

    .divider { border: none; border-top: 1px solid #FFF0ED; margin: .55rem 0; }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 500;
      font-size: .88rem;
      color: #c0574a;
    }

    .empty {
      text-align: center;
      color: #c4a09a;
      padding: 3rem 0;
      font-size: .95rem;
    }

    .footer {
      margin-top: 2rem;
      font-size: .8rem;
      color: #c4a09a;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Go digital. Go Kvitra.</h1>
    <p>Your receipts, always with you.</p>
  </div>

  <div class="card" id="auth-card">
    <div id="error"   class="error"   style="display:none"></div>
    <div id="success" class="success" style="display:none"></div>

    <div id="login-form">
      <div class="card-title">Log in</div>
      <input type="email"    id="login-email"    placeholder="Email">
      <input type="password" id="login-password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
      <button class="btn-primary"    onclick="login()">Log in</button>
      <button class="btn-secondary"  onclick="showSignup()">Create account</button>
    </div>

    <div id="signup-form" style="display:none">
      <div class="card-title">Create account</div>
      <input type="text"     id="signup-name"     placeholder="Full name">
      <input type="email"    id="signup-email"    placeholder="Email">
      <input type="password" id="signup-password" placeholder="Password (min 6 characters)" onkeydown="if(event.key==='Enter')signup()">
      <button class="btn-primary"   onclick="signup()">Sign up</button>
      <button class="btn-secondary" onclick="showLogin()">Back to login</button>
    </div>
  </div>

  <div class="footer">
    Kvitra &mdash; Digital Receipts &nbsp;&middot;&nbsp;
    <a href="admin.html" style="color:#c4a09a;text-decoration:none;">Admin</a>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="dash-header">
      <h2>My Receipts</h2>
      <button class="btn-secondary" onclick="logout()">Log out</button>
    </div>
    <div class="week-nav">
      <button class="week-nav-btn" onclick="prevWeek()">&#8249;</button>
      <span class="week-nav-label" id="week-label"></span>
      <button class="week-nav-btn" onclick="nextWeek()">&#8250;</button>
    </div>
    <div id="receipts-list"></div>
  </div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://whvrazrcoytddafpdujg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndodnJhenJjb3l0ZGRhZnBkdWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MDU3MjksImV4cCI6MjA5Mzk4MTcyOX0.-nQMSGqr3m2B6q9vfZTSMbip_W7Q6vRvlrQqS7xhZF0'
    );

    function setError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg; el.style.display = msg ? '' : 'none';
      document.getElementById('success').style.display = 'none';
    }

    function setSuccess(msg) {
      const el = document.getElementById('success');
      el.textContent = msg; el.style.display = msg ? '' : 'none';
      document.getElementById('error').style.display = 'none';
    }

    function showSignup() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('signup-form').style.display = '';
      setError('');
    }

    function showLogin() {
      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('login-form').style.display = '';
      setError('');
    }

    async function signup() {
      const name     = document.getElementById('signup-name').value.trim();
      const email    = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      if (!name || !email || !password) return setError('Please fill in all fields.');
      const { error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name } } });
      if (error) return setError(error.message);
      setSuccess('Account created! Check your email to confirm, then log in.');
      showLogin();
    }

    async function login() {
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return setError(error.message);
      showDashboard(data.user);
    }

    async function logout() {
      await sb.auth.signOut();
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('auth-card').style.display = '';
      document.querySelector('.hero').style.display = '';
      document.querySelector('.footer').style.display = '';
    }

    let allReceipts = [];
    let weekStart   = getWeekStart(new Date());

    function getWeekStart(d) {
      const date = new Date(d);
      const day  = date.getDay();
      date.setDate(date.getDate() - (day === 0 ? 6 : day - 1));
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function prevWeek() { weekStart = new Date(weekStart.getTime() - 7 * 86400000); renderWeek(); }
    function nextWeek() { weekStart = new Date(weekStart.getTime() + 7 * 86400000); renderWeek(); }

    function renderWeek() {
      const end  = new Date(weekStart.getTime() + 6 * 86400000);
      const fmtA = { month: 'short', day: 'numeric' };
      const fmtB = weekStart.getMonth() === end.getMonth() ? { day: 'numeric' } : fmtA;
      document.getElementById('week-label').textContent =
        weekStart.toLocaleDateString('en', fmtA) + ' – ' +
        end.toLocaleDateString('en', fmtB) + ', ' + end.getFullYear();

      const chev = `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;

      const days = Array.from({ length: 7 }, (_, i) => {
        const s = new Date(weekStart.getTime() + i * 86400000);
        const e = new Date(s.getTime() + 86400000 - 1);
        return { s, recs: allReceipts.filter(r => { const d = new Date(r.created_at); return d >= s && d <= e; }) };
      });

      const list = document.getElementById('receipts-list');

      list.innerHTML = days.map(({ s, recs }) => {
        const hasRecs  = recs.length > 0;
        const dayLabel = s.toLocaleDateString('en', { weekday: 'long', month: 'long', day: 'numeric' });
        const count    = hasRecs ? (recs.length === 1 ? '1 receipt' : `${recs.length} receipts`) : 'No receipts';

        const receiptsHtml = recs.map(r => {
          const hasItems = r.items && r.items.length;
          const body = hasItems ? `
            <div class="receipt-body">
              ${r.items.map(i => `<div class="item-row"><span>${i.name} &times;${i.qty}</span><span>${i.value}</span></div>`).join('')}
              <hr class="divider">
              <div class="total-row"><span>Total</span><span>${r.total_amount}</span></div>
            </div>` : '';
          return `
            <div class="receipt-card" onclick="toggleReceipt(this)">
              <div class="receipt-summary">
                <div class="receipt-summary-left">
                  <h3>${r.store_name || 'Purchase'}</h3>
                  <div class="time">${new Date(r.created_at).toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit', hour12: false })}</div>
                </div>
                <div class="receipt-summary-right">
                  <span class="receipt-total">${r.total_amount || ''}</span>
                  ${hasItems ? chev : ''}
                </div>
              </div>${body}
            </div>`;
        }).join('');

        return `
          <div class="day-group${hasRecs ? '' : ' empty-day'}">
            <div class="day-header" ${hasRecs ? 'onclick="toggleDay(this)"' : ''}>
              <div><div class="day-date">${dayLabel}</div><div class="day-count">${count}</div></div>
              <div class="day-header-right">${hasRecs ? chev : ''}</div>
            </div>
            ${hasRecs ? `<div class="day-body">${receiptsHtml}</div>` : ''}
          </div>`;
      }).join('');

      // Auto-expand today if it falls in this week
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const ti = Math.round((today.getTime() - weekStart.getTime()) / 86400000);
      if (ti >= 0 && ti < 7) {
        const g = list.querySelectorAll('.day-group')[ti];
        if (g && !g.classList.contains('empty-day')) g.classList.add('open');
      }
    }

    function toggleDay(header) { header.closest('.day-group').classList.toggle('open'); }
    function toggleReceipt(card) { card.classList.toggle('open'); }

    async function showDashboard(user) {
      document.getElementById('auth-card').style.display = 'none';
      document.querySelector('.hero').style.display = 'none';
      document.querySelector('.footer').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';

      const { data: receipts } = await sb
        .from('receipts').select('*')
        .eq('customer_id', user.id)
        .order('created_at', { ascending: false });

      allReceipts = receipts || [];
      weekStart   = getWeekStart(new Date());
      renderWeek();
    }

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) showDashboard(session.user);
    });
  </script>
</body>
</html>
